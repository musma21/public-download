<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Brick Breaker Adaptive</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud" id="hud">
    <div>점수: <span id="score">0</span></div>
    <div>레벨: <span id="level">1</span></div>
    <div>목숨: <span id="lives">3</span></div>
    <div class="device-badge" id="deviceBadge"></div>
    <div class="controls">
      <button id="btnStart">시작/재시작</button>
      <button id="btnPause">일시정지(P)</button>
      <button id="btnMode" title="컨트롤 모드 전환">모드:Drag</button>
      <button id="btnMute">음소거</button>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="game" aria-label="Brick Breaker Game" role="img"></canvas>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="panel" id="messagePanel">
      <h2 id="messageTitle">Brick Breaker</h2>
      <p id="messageBody">Space 또는 터치/클릭으로 시작</p>
      <div class="panel-buttons">
        <button id="btnCloseOverlay">닫기</button>
        <button id="btnStart2">바로 시작</button>
      </div>
    </div>
  </div>
  <footer>
    <p id="tips">
      데스크탑: 마우스/← →, Space 발사, P 일시정지.
      모바일: 화면 드래그로 패들 이동, 탭 발사.
    </p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
